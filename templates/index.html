<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask 天氣搜尋應用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .weather-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 30px;
            display: none;
            animation: slideIn 0.3s ease-in;
        }

        .weather-card.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .city-name {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 3.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .condition {
            font-size: 1.2em;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 20px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .detail-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            animation: slideIn 0.3s ease-in;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            text-align: center;
            display: none;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .timestamp {
            text-align: center;
            color: #999;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .example-cities {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .example-btn {
            background: #f0f0f0;
            color: #333;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }

        .example-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☀️ 天氣搜尋</h1>
        <p class="subtitle">搜尋全球任何城市的天氣</p>

        <div class="example-cities">
            <button class="example-btn" onclick="searchCity('台北')">台北</button>
            <button class="example-btn" onclick="searchCity('東京')">東京</button>
            <button class="example-btn" onclick="searchCity('紐約')">紐約</button>
            <button class="example-btn" onclick="searchCity('倫敦')">倫敦</button>
            <button class="example-btn" onclick="searchCity('香港')">香港</button>
            <button class="example-btn" onclick="searchCity('新加坡')">新加坡</button>
        </div>

        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="輸入城市名稱... (例如：台北、北京、東京)"
                onkeypress="handleKeyPress(event)"
            >
            <button onclick="searchCity()">搜尋</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">載入中...</p>
        </div>

        <div class="weather-card" id="weatherCard">
            <div class="city-name" id="cityName"></div>
            <div class="temperature" id="temperature"></div>
            <div class="condition" id="condition"></div>
            <div class="weather-details">
                <div class="detail-item">
                    <div class="detail-label">體感溫度</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">濕度</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">風速</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">可見度</div>
                    <div class="detail-value" id="visibility"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">氣壓</div>
                    <div class="detail-value" id="pressure"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">時間</div>
                    <div class="detail-value" style="font-size: 1em;" id="timestamp"></div>
                </div>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="timestamp" id="updateTime"></div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchCity();
            }
        }

        function searchCity(city = null) {
            const cityInput = document.getElementById('cityInput');
            const cityName = city || cityInput.value.trim();

            if (!cityName) {
                showError('請輸入城市名稱');
                return;
            }

            if (!city) {
                cityInput.value = '';
            }

            showLoading(true);
            hideError();

            fetch('/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ city: cityName })
            })
            .then(response => response.json())
            .then(data => {
                showLoading(false);

                if (data.success) {
                    displayWeather(data);
                } else {
                    showError(data.message || '無法獲取天氣信息');
                }
            })
            .catch(error => {
                showLoading(false);
                showError('網絡錯誤: ' + error.message);
                console.error('Error:', error);
            });
        }

        function displayWeather(data) {
            document.getElementById('cityName').textContent = data.city;
            document.getElementById('temperature').textContent = data.temperature + '°C';
            document.getElementById('condition').textContent = data.condition;
            document.getElementById('feelsLike').textContent = data.feels_like + '°C';
            document.getElementById('humidity').textContent = data.humidity + '%';
            document.getElementById('windSpeed').textContent = data.wind_speed + ' km/h';
            document.getElementById('visibility').textContent = data.visibility + ' km';
            document.getElementById('pressure').textContent = data.pressure + ' mb';
            document.getElementById('timestamp').textContent = data.timestamp;

            const weatherCard = document.getElementById('weatherCard');
            weatherCard.classList.remove('show');
            setTimeout(() => {
                weatherCard.classList.add('show');
            }, 10);
        }

        function showLoading(show) {
            const loading = document.getElementById('loading');
            if (show) {
                loading.classList.add('show');
            } else {
                loading.classList.remove('show');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.classList.add('show');
        }

        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
        }

        // 頁面載入時，自動搜尋一個預設城市
        window.addEventListener('load', () => {
            searchCity('台北');
        });
    </script>
</body>
</html>
